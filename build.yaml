# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# NOTE: ZMK moved to Zephyr 4.1 / hardware model v2, which renamed every
# board. The old `nrfmicro_13` target is now the `zmk` variant of the
# nRF52840 nRFMicro at revision 1.3.0.
---
include:
  - board: nrfmicro/nrf52840/zmk@1.3.0
    shield: corne_left
  - board: nrfmicro/nrf52840/zmk@1.3.0
    shield: corne_right
