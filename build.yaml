# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# NOTE: pinned to ZMK v0.3.0 (see config/west.yml), which predates the
# Zephyr 4.1 / hardware model v2 board rename. On ZMK main this target is
# spelled `nrfmicro@1.3.0/nrf52840/zmk` instead.
---
include:
  - board: nrfmicro_13
    shield: corne_left
  - board: nrfmicro_13
    shield: corne_right
